name: Build Rust Autoclicker Windows Executable

# Trigger: Workflow akan berjalan setiap kali ada 'push' atau 'pull request' ke branch main,
# serta mendukung penjalanan manual melalui tab Actions di GitHub.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Release (.exe) on Windows
    runs-on: windows-latest

    steps:
      # Langkah 1: Checkout repository kode dari GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Setup Toolchain Rust
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Langkah 3: Caching dependensi Cargo agar kompilasi berikutnya jauh lebih cepat
      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      # Langkah 4: Kompilasi aplikasi dalam mode Release (Dioptimalkan)
      - name: Build Executable
        run: cargo build --release

      # Langkah 5: Upload hasil file .exe ke Artifacts GitHub (Bisa diunduh langsung)
      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autoclicker-Windows-x64
          path: target/release/autoclicker.exe
          if-no-files-found: error